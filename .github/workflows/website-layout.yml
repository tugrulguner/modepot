name: Website layout

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'README.md'
      - 'BRAND.md'
      - 'public/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - 'playwright.config.mjs'
      - '.github/workflows/website-layout.yml'
      - '.github/workflows/sync-project-sources.yml'

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --shm-size=1g
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust checkout for git operations
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:identity
      - run: npm run test:workflow-contract
      - run: npm run check:identity
      - run: npm run check
      - run: npm run test:project-sync
      - run: npm run build
      - run: npm run test:layout
