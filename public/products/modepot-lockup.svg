  <title id="title">ModePot — Open-source software foundations, tools and games</title>
  <desc id="desc">The cyan flask, violet M and cyan–violet–mint ModePot wordmark match the website identity, with two lines describing the open-source family.</desc>
  <defs>
    <linearGradient id="modepot-wordmark-spectrum" gradientUnits="userSpaceOnUse" x1="735.796977425" y1="384.717240136" x2="905.849812125" y2="430.282759864">
      <stop stop-color="#66D9FF" offset="0%"/>
      <stop stop-color="#A987FF" offset="52%"/>
      <stop stop-color="#77E5BD" offset="100%"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="#080C12"/>
  <g transform="translate(78 267) scale(3)">
    <path d="M44 22h10v20c0 5-2.3 9.6-6.2 12.4C34.1 64.3 26 78.2 26 93c0 17 12.7 25 38 25s38-8 38-25c0-14.8-8.1-28.7-21.8-38.6C76.3 51.6 74 47 74 42V22h10" fill="none" stroke="#66D9FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
