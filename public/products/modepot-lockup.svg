    <text x="510" y="446" fill="#F4F0E7" font-size="100" font-weight="720" letter-spacing="-.085em">mode<tspan fill="url(#modepot-wordmark-spectrum)">pot</tspan></text>
    <text x="520" y="526" fill="#C1C4CD" font-size="27">Frameworks, tools, engines and games.</text>
    <text x="520" y="572" fill="#C1C4CD" font-size="27">Built in the open with the community.</text>
