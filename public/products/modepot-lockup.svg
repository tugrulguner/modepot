<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">ModePot — Open-source software foundations, tools and games</title><desc id="desc">The multicolour ModePot flask and lowercase wordmark on the family lockup canvas, with two lines describing the open-source family.</desc><rect width="1200" height="900" fill="#080C12"/><g transform="translate(78 267) scale(3)"><path d="M44 22h10v20c0 5-2.3 9.6-6.2 12.4C34.1 64.3 26 78.2 26 93c0 17 12.7 25 38 25s38-8 38-25c0-14.8-8.1-28.7-21.8-38.6C76.3 51.6 74 47 74 42V22h10" fill="none" stroke="#66D9FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 100V80l22 16 22-16v20" fill="none" stroke="#A987FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M456 220V680" stroke="#30343C" stroke-width="2"/><g font-family="Manrope, Arial, sans-serif"><text x="520" y="286" fill="#66D9FF" font-size="18" font-weight="700" letter-spacing="4">OPEN SOURCE / BUILT TOGETHER</text><text x="510" y="446" fill="#F4F0E7" font-size="100" font-weight="700" letter-spacing="-5">mode<tspan fill="#77E5BD">pot</tspan></text><text x="520" y="526" fill="#C1C4CD" font-size="27">Frameworks, tools, engines and games.</text><text x="520" y="572" fill="#C1C4CD" font-size="27">Built in the open with the community.</text></g><path d="M520 626H1090" stroke="#77E5BD" stroke-width="4"/></svg>
